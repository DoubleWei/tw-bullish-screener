name: Update Stock Signals

on:
  schedule:
    # 每 6 小時跑一次（UTC） → TPE 03:00, 09:00, 15:00, 21:00
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:   ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python scripts/pipeline.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Quick check: anything to commit at all?
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git reset HEAD public/data/

          # Retry loop handles race where remote advances between pull and push
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git add public/data/
            git commit -m "data: refresh signals $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push && exit 0
            echo "Push rejected (attempt ${attempt}/3), resyncing..."
            git reset HEAD~1 --soft
          done
          echo "Failed to push after 3 attempts"
          exit 1
